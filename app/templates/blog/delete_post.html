<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Post</title>
</head>
<body>

<h1>Delete Post</h1>

<p>
    Are you sure you want to delete
    <strong>{{ post.title }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>

<a href="{% url 'post_detail' post.pk %}">
    Cancel
</a>

</body>
</html>
