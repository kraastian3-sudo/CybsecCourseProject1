<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
</head>
<body>
    <h1>My Blog</h1>

    {% for post in posts %}
        <article>
            <h2>
                <a href="{% url 'post_detail' post.pk %}">
                    {{ post.title }}
                </a>
            </h2>

            <small>{{ post.created_at }}</small>

            <p>{{ post.content|truncatewords:30 }}</p>
        </article>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}
</body>
</html>
