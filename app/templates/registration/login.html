<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - My Blog</title>
</head>
<body>
    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    {% if form.errors %}
        <p>Invalid username or password.</p>
    {% endif %}

    <a href="{% url 'post_list' %}">Back to blog</a>
</body>
</html>
