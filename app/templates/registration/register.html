<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - My Blog</title>
</head>
<body>
    <h1>Create an account</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </p>

    <p>
        <a href="{% url 'post_list' %}">Back to blog</a>
    </p>
</body>
</html>
